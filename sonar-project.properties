# SonarQube Cloud Project Configuration
sonar.projectKey=project-management-version-2

# Source & Test directories
sonar.sources=backend-node/src,frontend/src
sonar.tests=backend-node/tests,frontend/src/tests,frontend/src/services
sonar.test.inclusions=**/*.test.ts,**/*.test.js,**/*.spec.ts,**/*.spec.js

# Exclusions: exclude third-party dependencies, build output, coverage reports, and legacy directories
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.s3-local-data/**,backend/**,intern_dashboard/**,manager/**,scripts/**

# Code Coverage Reports (LCOV)
sonar.javascript.lcov.reportPaths=backend-node/coverage/lcov.info,frontend/coverage/lcov.info

# Source Encoding
sonar.sourceEncoding=UTF-8

