name: SonarQube Cloud Analysis & Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-and-scan:
    name: Build, Test & Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones must be disabled for SonarQube blame and new code detection

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend-node/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend-node
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend-node
        run: npx prisma generate

      - name: Backend TypeScript Check
        working-directory: backend-node
        run: npm run typecheck

      - name: Run Backend Unit Tests & Generate Coverage
        working-directory: backend-node
        run: npm run test:coverage -- tests/unit

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests & Generate Coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=sonar-project.properties

