name: SonarQube Cloud Analysis & Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-and-scan:
    name: Build, Test & Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Shallow clones must be disabled for SonarQube blame and new code detection

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend-node/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend-node
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        working-directory: backend-node
        run: npm run prisma:generate

      - name: Backend TypeScript Check
        working-directory: backend-node
        run: npm run typecheck

      - name: Run Backend Unit Tests & Generate Coverage
        working-directory: backend-node
        run: npm run test:coverage -- tests/unit

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run Frontend Tests & Generate Coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=sonar-project.properties

